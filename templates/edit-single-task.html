<!DOCTYPE html>
<html>
<head>
    <style>
    /* Denne side ligner oprettelsessiden, men bruges til at ændre en eksisterende opgave. */
    .tilbage {
        top: 15px;
        left: 15px;
        text-decoration: none;
        color: black;
        border: 1px solid black;
        border-radius: 5px;
        background: none;
        cursor: pointer;
        padding: 4px 8px;
    }
    .save {
        margin-top: 5px;
    }

    .form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    form {
        display: flex;
        flex-direction: column;
        width: 400px;
        text-align: center;
    }

    input,textarea,option {
        text-align: center;
    }
    textarea {
        height: 100px;
    }
    p {
        background-color: lightblue;
        border-radius: 5px;
    }

    .warning-message {
        color: #b00020;
        font-weight: bold;
        margin: 8px 0;
        background-color: #ffe6e6;
        border: 1px solid #d88;
        border-radius: 5px;
        padding: 8px;
    }

    /* Bruges til at tilføje ekstra dage, hvis opgaven skal ligge flere steder i ugen. */
    .day-select-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
    }

    .extra-day-btn {
        background: none;
        border: 1px solid black;
        border-radius: 5px;
        padding: 6px 10px;
        cursor: pointer;
        margin-top: 4px;
    }
    </style>

<title> Add task </title>
    </head>
    <body>
        <a class="tilbage" href="/"> Tilbage </a>

        <div class="form-container">
        <form action="/edit-task/{{task.id}}" method="POST" enctype="multipart/form-data" id="edit-task-form">
            <!-- Viser besked, hvis der mangler noget i formularen. -->
            {% if error %}
            <div class="warning-message">{{ error }}</div>
            {% endif %}

            <p>Tilføj en titel til opgaven*</p>
            <input type="text" name="title" placeholder="Titel" value="{{ task.title }}" data-required="true" required>
         
            <p>Tilføj en dybere beskrivelse af opgaven*</p>
            <textarea name="description" placeholder="Beskrivelse" data-required="true" required>{{task.description}}</textarea>

            <p>Vælg hvilket tidspunkt på dagen opgaven skal udføres*</p>
            <select name="time_of_day" data-required="true" required>
                <option value="morning" {% if task.time_of_day == "morning" %}selected{% endif %}>Morgen</option>
                <option value="midday" {% if task.time_of_day == "midday" %}selected{% endif %}>Middag</option>
                <option value="night" {% if task.time_of_day == "night" %}selected{% endif %}>Aften</option>
            </select>

            
            <p>Tilføj specifikt tidspunkt (valgfrit)</p>
            <div style="float: left; align-items: center; justify-content: center;">
            <select name="specific_time_hh">
                <option value="">HH</option>
                <option value="05">05</option>
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
            </select>
            :
            <select name="specific_time_mm">
                <option value="">MM</option>
                <option value="00">00</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
            </select>
            </div>


            <p>Vælg hvilken dag om ugen opgaven skal udføres*</p>
            <div class="day-select-row" id="weekday-container">
                <select name="weekday" data-required="true" required>
                    <option value="Monday" {% if task.weekday == "Monday" %}selected{% endif %}>Mandag</option>
                    <option value="Tuesday" {% if task.weekday == "Tuesday" %}selected{% endif %}>Tirsdag</option>
                    <option value="Wednesday" {% if task.weekday == "Wednesday" %}selected{% endif %}>Onsdag</option>
                    <option value="Thursday" {% if task.weekday == "Thursday" %}selected{% endif %}>Torsdag</option>
                    <option value="Friday" {% if task.weekday == "Friday" %}selected{% endif %}>Fredag</option>
                    <option value="Saturday" {% if task.weekday == "Saturday" %}selected{% endif %}>Lørdag</option>
                    <option value="Sunday" {% if task.weekday == "Sunday" %}selected{% endif %}>Søndag</option>
                </select>
            </div>
            <button type="button" class="extra-day-btn" id="add-day-button">+ vælg ekstra dag opgaven skal udføres</button>
            <button class="save" type="submit">Gem opgave</button>
        </form>
        </div>

        <script>
            // Genbruger samme idé som på add-task siden: man kan vælge ekstra dage.
            function addDaySelect() {
                const container = document.getElementById('weekday-container');
                const currentSelects = container.querySelectorAll('select');
                if (currentSelects.length >= 7) {
                    alert('Du kan maksimalt vælge 7 dage.');
                    return;
                }

                const newSelect = document.createElement('select');
                newSelect.name = 'extra_weekdays';
                newSelect.innerHTML = `
                    <option value="">Vælg ekstra dag</option>
                    <option value="Monday">Mandag</option>
                    <option value="Tuesday">Tirsdag</option>
                    <option value="Wednesday">Onsdag</option>
                    <option value="Thursday">Torsdag</option>
                    <option value="Friday">Fredag</option>
                    <option value="Saturday">Lørdag</option>
                    <option value="Sunday">Søndag</option>
                `;

                const selectedValues = Array.from(currentSelects).map(select => select.value).filter(Boolean);
                const options = Array.from(newSelect.options);
                options.forEach(option => {
                    if (selectedValues.includes(option.value)) {
                        option.disabled = true;
                    }
                });

                container.appendChild(newSelect);
            }

            document.getElementById('add-day-button').addEventListener('click', addDaySelect);

            document.getElementById('edit-task-form').addEventListener('submit', function(event) {
                // Tjekker at der er skrevet noget i de felter, der er markeret som påkrævede.
                const requiredFields = this.querySelectorAll('[data-required="true"]');
                let missing = false;

                requiredFields.forEach(field => {
                    if (!field.value || !field.value.trim()) {
                        missing = true;
                    }
                });

                if (missing) {
                    event.preventDefault();
                    alert('Du mangler at udfylde nogle felter. Alle felter markeret med * er obligatoriske.');
                }
            });
        </script>
    </body>
</html>
