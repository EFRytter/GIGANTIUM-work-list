<!DOCTYPE html>
<html>
<head>
    <style>
    /* Siden er lavet enkelt, så fokus er på selve opgaveformularen. */
    .tilbage {
        top: 15px;
        left: 15px;
        text-decoration: none;
        color: black;
        border: 1px solid black;
        border-radius: 5px;
        background: none;
        cursor: pointer;
        padding: 4px 8px;
    }

    .form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    form {
        display: flex;
        flex-direction: column;
        width: 400px;
        text-align: center;
    }

    input,textarea,option {
        text-align: center;
    }

    textarea {
        height: 100px;
    }

    p {
        background-color: lightblue;
        border-radius: 5px;
    }

    .warning-message {
        color: #b00020;
        font-weight: bold;
        margin: 8px 0;
        background-color: #ffe6e6;
        border: 1px solid #d88;
        border-radius: 5px;
        padding: 8px;
    }

    /* Her kan man vælge en eller flere dage for samme opgave. */
    .day-select-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
    }

    .extra-day-btn {
        background: none;
        border: 1px solid black;
        border-radius: 5px;
        padding: 6px 10px;
        cursor: pointer;
        margin-top: 4px;
    }
    </style>

<title> Add task </title>
    </head>
    <body>
        <a class="tilbage" href="/"> Tilbage </a>

        <div class="form-container">
        <form action="/add-task" method="POST" enctype="multipart/form-data" id="add-task-form">
            <!-- Viser en fejlbesked hvis et påkrævet felt mangler. -->
            {% if error %}
            <div class="warning-message">{{ error }}</div>
            {% endif %}

            <p>Tilføj en titel til opgaven*</p>
            <input type="text" name="title" placeholder="Titel" data-required="true" required>
         
            <p>Tilføj en dybere beskrivelse af opgaven*</p>
            <textarea name="description" placeholder="Beskrivelse" data-required="true" required></textarea>

            <p>Tilføj et billede (valgfrit)</p>
            <input type="file" name="image" accept="image/*">

            <p>Vælg hvilket tidspunkt på dagen opgaven skal udføres*</p>
            <select name="time_of_day" data-required="true" required>
                <option value="">Vælg tidspunkt</option>
                <option value="morning">Morgen</option>
                <option value="midday">Middag</option>
                <option value="night">Aften</option>
            </select>

            <p>Vælg hvilken dag om ugen opgaven skal udføres*</p>
            <div class="day-select-row" id="weekday-container">
                <select name="weekday" data-required="true" required>
                    <option value="">Vælg dag</option>
                    <option value="Monday">Mandag</option>
                    <option value="Tuesday">Tirsdag</option>
                    <option value="Wednesday">Onsdag</option>
                    <option value="Thursday">Torsdag</option>
                    <option value="Friday">Fredag</option>
                    <option value="Saturday">Lørdag</option>
                    <option value="Sunday">Søndag</option>
                </select>
            </div>
            <button type="button" class="extra-day-btn" id="add-day-button">+ vælg ekstra dag opgaven skal udføres</button>
            <button type="submit">Gem opgave</button>
        </form>
        </div>

        <script>
            // Lader brugeren tilføje flere dage uden at skulle udfylde hele formularen igen.
            function addDaySelect() {
                const container = document.getElementById('weekday-container');
                const currentSelects = container.querySelectorAll('select');
                if (currentSelects.length >= 7) {
                    alert('Du kan maksimalt vælge 7 dage.');
                    return;
                }

                const newSelect = document.createElement('select');
                newSelect.name = 'extra_weekdays';
                newSelect.innerHTML = `
                    <option value="">Vælg ekstra dag</option>
                    <option value="Monday">Mandag</option>
                    <option value="Tuesday">Tirsdag</option>
                    <option value="Wednesday">Onsdag</option>
                    <option value="Thursday">Torsdag</option>
                    <option value="Friday">Fredag</option>
                    <option value="Saturday">Lørdag</option>
                    <option value="Sunday">Søndag</option>
                `;

                const selectedValues = Array.from(currentSelects).map(select => select.value).filter(Boolean);
                const options = Array.from(newSelect.options);
                options.forEach(option => {
                    if (selectedValues.includes(option.value)) {
                        option.disabled = true;
                    }
                });

                container.appendChild(newSelect);
            }

            document.getElementById('add-day-button').addEventListener('click', addDaySelect);

            document.getElementById('add-task-form').addEventListener('submit', function(event) {
                // Gør et hurtigt tjek, så tomme felter ikke sendes af sted.
                const requiredFields = this.querySelectorAll('[data-required="true"]');
                let missing = false;

                requiredFields.forEach(field => {
                    if (!field.value || !field.value.trim()) {
                        missing = true;
                    }
                });

                if (missing) {
                    event.preventDefault();
                    alert('Du mangler at udfylde nogle felter. Alle felter markeret med * er obligatoriske.');
                }
            });
        </script>
    </body>
</html>
